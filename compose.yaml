services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ime_app
      POSTGRES_DB: investment_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ime_app -d investment_memory"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
