<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1140" viewBox="0 0 1230 1140">
<rect width="1230" height="1140" fill="#f5f6f1"/>
<style>text{font-family:Arial,sans-serif;fill:#153c34}.field{font-size:16px}.edge{fill:none;stroke:#5a7d62;stroke-width:2}.label{font-size:14px;paint-order:stroke;stroke:#f5f6f1;stroke-width:5px;stroke-linejoin:round}</style>
