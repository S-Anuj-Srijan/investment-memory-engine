<polyline fill="none" stroke="#5a7d62" stroke-width="2" points="390,895 435,895" stroke-dasharray="7 5"/>
<text font-family="Arial, sans-serif" class="label" x="393" y="883">0..1</text>
<polyline fill="none" stroke="#5a7d62" stroke-width="2" points="1200,200 1215,200 1215,900 1200,900"/>
<text font-family="Arial, sans-serif" class="label" x="1170" y="736">actor</text>
<polyline fill="none" stroke="#5a7d62" stroke-width="2" points="795,580 815,580 815,885 840,885" stroke-dasharray="7 5"/>
<text font-family="Arial, sans-serif" class="label" x="763" y="739">audit event</text>
<rect x="30" y="80" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="30" y="80" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="44" y="108" style="fill:white" font-size="18" font-weight="bold">companies</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="147">PK company_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="172">company_name : text</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="197">UQ ticker : text</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="222">sector : text</text>
<rect x="435" y="80" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="435" y="80" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="449" y="108" style="fill:white" font-size="18" font-weight="bold">models</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="147">PK model_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="172">model_name : text</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="197">version : text</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="222">UQ (model_name, version)</text>
<rect x="840" y="80" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="840" y="80" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="854" y="108" style="fill:white" font-size="18" font-weight="bold">users</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="147">PK user_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="172">UQ email : text</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="197">display_name : text</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="222">password_hash : text</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="247">role : admin | analyst</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="272">created_at : timestamptz</text>
<rect x="30" y="410" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="30" y="410" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="44" y="438" style="fill:white" font-size="18" font-weight="bold">news</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="477">PK news_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="502">headline : text</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="527">news_text : text</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="552">published_at : date</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="577">source : text</text>
<rect x="435" y="410" width="360" height="265" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="435" y="410" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="449" y="438" style="fill:white" font-size="18" font-weight="bold">investments</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="477">PK investment_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="502">FK company_id, model_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="527">investment_amount : numeric(16,2)</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="552">decision : BUY | SELL | HOLD</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="577">trade_date : date</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="602">return_percentage : numeric nullable</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="627">FK created_by : bigint nullable</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="652">revision : integer</text>
<rect x="840" y="410" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="840" y="410" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="854" y="438" style="fill:white" font-size="18" font-weight="bold">sessions</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="477">PK token_hash : text</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="502">FK user_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="527">expires_at : timestamptz</text>
<rect x="30" y="770" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="30" y="770" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="44" y="798" style="fill:white" font-size="18" font-weight="bold">Chroma investment_memories_v2</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="837">ID = vector_memory_id</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="862">embedding : float[384]</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="887">document : headline + news + reasoning</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="912">metadata : reasoning_id, fingerprint, model</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="937">HNSW index : cosine distance</text>
<text font-family="Arial, sans-serif" class="field" x="44" y="962">Derived; rebuildable from PostgreSQL</text>
<rect x="435" y="770" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="435" y="770" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="449" y="798" style="fill:white" font-size="18" font-weight="bold">investment_reasoning</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="837">PK reasoning_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="862">FK investment_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="887">FK news_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="912">reasoning_text : text</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="937">confidence : numeric(5,4)</text>
<text font-family="Arial, sans-serif" class="field" x="449" y="962">UQ vector_memory_id : text</text>
<rect x="840" y="770" width="360" height="230" rx="10" fill="white" stroke="#a7bda3"/>
<rect x="840" y="770" width="360" height="42" rx="10" fill="#17624e"/>
<text font-family="Arial, sans-serif" x="854" y="798" style="fill:white" font-size="18" font-weight="bold">audit_log</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="837">PK audit_id : bigint</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="862">table_name, operation : text</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="887">record_id : bigint (no FK)</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="912">FK actor_id : bigint nullable</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="937">old_data, new_data : jsonb</text>
<text font-family="Arial, sans-serif" class="field" x="854" y="962">occurred_at : timestamptz</text>
<text font-family="Arial, sans-serif" x="30" y="1065" font-size="16">PK = primary key | FK = foreign key | UQ = unique. All IDs are bigint identities except session and vector IDs.</text>
<text font-family="Arial, sans-serif" x="30" y="1092" font-size="16">Dashed lines are derived/event links, not SQL foreign keys. Audit record IDs survive investment deletion.</text>
<text font-family="Arial, sans-serif" x="30" y="1118" font-size="16">Detailed attributes and constraints: docs/DATABASE_DESIGN.md and sql/03_schema.sql.</text>
</svg>